<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%" style="background:#0f172a; border-radius:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Gradienty stali nierdzewnej -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Mosiądz -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Woda w rotametrze -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Szkło cylindra -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Zawór czerwony (zasilanie) -->
    <radialGradient id="redValveGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Zawór niebieski (powrót) -->
    <radialGradient id="blueValveGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>

    <!-- Siłownik termoelektryczny -->
    <linearGradient id="actuatorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Cień -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Karta Lovelace - Tło -->
  <rect x="25" y="20" width="900" height="480" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Nagłówek karty -->
  <g transform="translate(50, 45)">
    <!-- Ikona rozdzielacza -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#0284c7" fill-opacity="0.15"/>
    <path d="M12 16h20M12 22h20M12 28h20M16 12v20M22 12v20M28 12v20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tytuł i podsumowanie -->
    <text x="56" y="20" fill="#f8fafc" font-size="18" font-weight="700">Rozdzielacz Parter (6 obiegów)</text>
    <text x="56" y="38" fill="#94a3b8" font-size="13">
      Kotłownia / Parter  •  Przepływ całkowity: <tspan fill="#38bdf8" font-weight="700">8.2 l/min</tspan> (492 l/h)  •  ΔT: <tspan fill="#fbbf24" font-weight="600">6.0°C</tspan>  •  Maks. Δp: <tspan fill="#34d399" font-weight="600">14.8 kPa</tspan>
    </text>

    <!-- Przełącznik pięter -->
    <rect x="680" y="6" width="90" height="30" rx="8" fill="#0284c7"/>
    <text x="725" y="26" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Parter (6)</text>
    <rect x="778" y="6" width="90" height="30" rx="8" fill="#334155"/>
    <text x="823" y="26" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Piętro (5)</text>
  </g>

  <!-- Linia podziału -->
  <line x1="50" y1="105" x2="900" y2="105" stroke="#334155" stroke-width="1"/>

  <!-- WIZUALIZACJA HYDRAULICZNA ROZDZIELACZA -->
  <g transform="translate(50, 120)">
    
    <!-- ================= BELKA ZASILANIA (GÓRNA) ================= -->
    <!-- Zawór kulowy czerwony z termometrem -->
    <g transform="translate(20, 40)">
      <rect x="0" y="6" width="40" height="28" rx="4" fill="url(#brassGrad)"/>
      <circle cx="20" cy="-6" r="18" fill="url(#redValveGrad)" stroke="#7f1d1d" stroke-width="1.5"/>
      <circle cx="20" cy="-6" r="13" fill="#ffffff"/>
      <!-- Tarcza termometru -->
      <path d="M12 -6 A 8 8 0 0 1 28 -6" fill="none" stroke="#ef4444" stroke-width="2"/>
      <line x1="20" y1="-6" x2="25" y2="-12" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="-3" fill="#0f172a" font-size="8" font-weight="800" text-anchor="middle">38°C</text>
      <text x="20" y="48" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">ZASILANIE</text>
    </g>

    <!-- Główna belka stalowa zasilania -->
    <rect x="65" y="44" width="765" height="32" rx="6" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.2"/>
    <!-- Odpowietrznik i spust po prawej -->
    <rect x="805" y="32" width="20" height="12" rx="2" fill="url(#brassGrad)"/>
    <rect x="810" y="20" width="10" height="12" rx="2" fill="#cbd5e1"/>

    <!-- ================= BELKA POWROTU (DOLNA) ================= -->
    <!-- Zawór kulowy niebieski z termometrem -->
    <g transform="translate(20, 160)">
      <rect x="0" y="6" width="40" height="28" rx="4" fill="url(#brassGrad)"/>
      <circle cx="20" cy="-6" r="18" fill="url(#blueValveGrad)" stroke="#1e3a8a" stroke-width="1.5"/>
      <circle cx="20" cy="-6" r="13" fill="#ffffff"/>
      <!-- Tarcza termometru -->
      <path d="M12 -6 A 8 8 0 0 1 28 -6" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <line x1="20" y1="-6" x2="23" y2="-13" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="-3" fill="#0f172a" font-size="8" font-weight="800" text-anchor="middle">32°C</text>
      <text x="20" y="48" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle">POWRÓT</text>
    </g>

    <!-- Główna belka stalowa powrotu -->
    <rect x="65" y="164" width="765" height="32" rx="6" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.2"/>
    <!-- Odpowietrznik i spust po prawej -->
    <rect x="805" y="152" width="20" height="12" rx="2" fill="url(#brassGrad)"/>
    <rect x="810" y="140" width="10" height="12" rx="2" fill="#cbd5e1"/>

    <!-- Uchwyty montażowe ścienne -->
    <rect x="180" y="20" width="16" height="200" rx="3" fill="#475569" opacity="0.35"/>
    <rect x="710" y="20" width="16" height="200" rx="3" fill="#475569" opacity="0.35"/>


    <!-- ================= SEKCJE PĘTLI 1 - 6 ================= -->
    
    <!-- PĘTLA 1: Salon 1 -->
    <g transform="translate(130, 0)">
      <!-- Rotametr (zasilanie) -->
      <rect x="-10" y="32" width="20" height="12" fill="url(#brassGrad)" rx="2"/>
      <!-- Szklany cylinder -->
      <rect x="-9" y="-20" width="18" height="52" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
      <rect x="-8" y="-19" width="16" height="50" fill="url(#glassGrad)" rx="3"/>
      <!-- Słup wody w rotametrze (przepływ 1.8 l/min) -->
      <rect x="-7" y="1" width="14" height="30" fill="url(#waterGrad)" rx="2"/>
      <!-- Czerwony pływak -->
      <rect x="-6" y="0" width="12" height="4" fill="#ef4444" rx="1"/>
      <!-- Pokrętło rotametru u góry -->
      <rect x="-11" y="-28" width="22" height="9" fill="#0284c7" rx="3"/>
      
      <!-- Siłownik termoelektryczny (powrót) -->
      <rect x="-12" y="112" width="24" height="48" rx="5" fill="url(#actuatorGrad)" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="0" cy="120" r="3" fill="#22c55e"/> <!-- Dioda aktywności -->
      <rect x="-9" y="160" width="18" height="8" fill="url(#brassGrad)"/>

      <!-- Rury PEX zasilanie/powrót -->
      <path d="M0,76 v15 M0,196 v15" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

      <!-- Panel strefy i regulacji -->
      <rect x="-48" y="225" width="96" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="243" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Salon 1</text>
      <text x="0" y="258" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">1.8 l/m</text>
      <text x="0" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">108 l/h • 78m</text>
      <rect x="-38" y="280" width="34" height="22" rx="4" fill="#334155"/>
      <text x="-21" y="295" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">-</text>
      <rect x="4" y="280" width="34" height="22" rx="4" fill="#0284c7"/>
      <text x="21" y="295" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">+</text>
    </g>

    <!-- PĘTLA 2: Salon 2 -->
    <g transform="translate(240, 0)">
      <rect x="-10" y="32" width="20" height="12" fill="url(#brassGrad)" rx="2"/>
      <rect x="-9" y="-20" width="18" height="52" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
      <rect x="-8" y="-19" width="16" height="50" fill="url(#glassGrad)" rx="3"/>
      <!-- Słup wody (1.5 l/min) -->
      <rect x="-7" y="6" width="14" height="25" fill="url(#waterGrad)" rx="2"/>
      <rect x="-6" y="5" width="12" height="4" fill="#ef4444" rx="1"/>
      <rect x="-11" y="-28" width="22" height="9" fill="#0284c7" rx="3"/>
      <rect x="-12" y="112" width="24" height="48" rx="5" fill="url(#actuatorGrad)" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="0" cy="120" r="3" fill="#22c55e"/>
      <rect x="-9" y="160" width="18" height="8" fill="url(#brassGrad)"/>
      <path d="M0,76 v15 M0,196 v15" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

      <rect x="-48" y="225" width="96" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="243" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Salon 2</text>
      <text x="0" y="258" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">1.5 l/m</text>
      <text x="0" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">90 l/h • 72m</text>
      <rect x="-38" y="280" width="34" height="22" rx="4" fill="#334155"/>
      <text x="-21" y="295" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">-</text>
      <rect x="4" y="280" width="34" height="22" rx="4" fill="#0284c7"/>
      <text x="21" y="295" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">+</text>
    </g>

    <!-- PĘTLA 3: Kuchnia -->
    <g transform="translate(350, 0)">
      <rect x="-10" y="32" width="20" height="12" fill="url(#brassGrad)" rx="2"/>
      <rect x="-9" y="-20" width="18" height="52" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
      <rect x="-8" y="-19" width="16" height="50" fill="url(#glassGrad)" rx="3"/>
      <!-- Słup wody (1.2 l/min) -->
      <rect x="-7" y="11" width="14" height="20" fill="url(#waterGrad)" rx="2"/>
      <rect x="-6" y="10" width="12" height="4" fill="#ef4444" rx="1"/>
      <rect x="-11" y="-28" width="22" height="9" fill="#0284c7" rx="3"/>
      <rect x="-12" y="112" width="24" height="48" rx="5" fill="url(#actuatorGrad)" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="0" cy="120" r="3" fill="#22c55e"/>
      <rect x="-9" y="160" width="18" height="8" fill="url(#brassGrad)"/>
      <path d="M0,76 v15 M0,196 v15" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

      <rect x="-48" y="225" width="96" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="243" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Kuchnia</text>
      <text x="0" y="258" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">1.2 l/m</text>
      <text x="0" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">72 l/h • 64m</text>
      <rect x="-38" y="280" width="34" height="22" rx="4" fill="#334155"/>
      <text x="-21" y="295" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">-</text>
      <rect x="4" y="280" width="34" height="22" rx="4" fill="#0284c7"/>
      <text x="21" y="295" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">+</text>
    </g>

    <!-- PĘTLA 4: Łazienka -->
    <g transform="translate(460, 0)">
      <rect x="-10" y="32" width="20" height="12" fill="url(#brassGrad)" rx="2"/>
      <rect x="-9" y="-20" width="18" height="52" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
      <rect x="-8" y="-19" width="16" height="50" fill="url(#glassGrad)" rx="3"/>
      <!-- Słup wody (1.6 l/min) -->
      <rect x="-7" y="4" width="14" height="27" fill="url(#waterGrad)" rx="2"/>
      <rect x="-6" y="3" width="12" height="4" fill="#ef4444" rx="1"/>
      <rect x="-11" y="-28" width="22" height="9" fill="#0284c7" rx="3"/>
      <rect x="-12" y="112" width="24" height="48" rx="5" fill="url(#actuatorGrad)" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="0" cy="120" r="3" fill="#22c55e"/>
      <rect x="-9" y="160" width="18" height="8" fill="url(#brassGrad)"/>
      <path d="M0,76 v15 M0,196 v15" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

      <rect x="-48" y="225" width="96" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="243" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Łazienka</text>
      <text x="0" y="258" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">1.6 l/m</text>
      <text x="0" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">96 l/h • 55m</text>
      <rect x="-38" y="280" width="34" height="22" rx="4" fill="#334155"/>
      <text x="-21" y="295" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">-</text>
      <rect x="4" y="280" width="34" height="22" rx="4" fill="#0284c7"/>
      <text x="21" y="295" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">+</text>
    </g>

    <!-- PĘTLA 5: Korytarz -->
    <g transform="translate(570, 0)">
      <rect x="-10" y="32" width="20" height="12" fill="url(#brassGrad)" rx="2"/>
      <rect x="-9" y="-20" width="18" height="52" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
      <rect x="-8" y="-19" width="16" height="50" fill="url(#glassGrad)" rx="3"/>
      <!-- Słup wody (1.0 l/min) -->
      <rect x="-7" y="15" width="14" height="16" fill="url(#waterGrad)" rx="2"/>
      <rect x="-6" y="14" width="12" height="4" fill="#ef4444" rx="1"/>
      <rect x="-11" y="-28" width="22" height="9" fill="#0284c7" rx="3"/>
      <rect x="-12" y="112" width="24" height="48" rx="5" fill="url(#actuatorGrad)" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="0" cy="120" r="3" fill="#22c55e"/>
      <rect x="-9" y="160" width="18" height="8" fill="url(#brassGrad)"/>
      <path d="M0,76 v15 M0,196 v15" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

      <rect x="-48" y="225" width="96" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="243" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Korytarz</text>
      <text x="0" y="258" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">1.0 l/m</text>
      <text x="0" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">60 l/h • 42m</text>
      <rect x="-38" y="280" width="34" height="22" rx="4" fill="#334155"/>
      <text x="-21" y="295" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">-</text>
      <rect x="4" y="280" width="34" height="22" rx="4" fill="#0284c7"/>
      <text x="21" y="295" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">+</text>
    </g>

    <!-- PĘTLA 6: Gabinet -->
    <g transform="translate(680, 0)">
      <rect x="-10" y="32" width="20" height="12" fill="url(#brassGrad)" rx="2"/>
      <rect x="-9" y="-20" width="18" height="52" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
      <rect x="-8" y="-19" width="16" height="50" fill="url(#glassGrad)" rx="3"/>
      <!-- Słup wody (1.1 l/min) -->
      <rect x="-7" y="13" width="14" height="18" fill="url(#waterGrad)" rx="2"/>
      <rect x="-6" y="12" width="12" height="4" fill="#ef4444" rx="1"/>
      <rect x="-11" y="-28" width="22" height="9" fill="#0284c7" rx="3"/>
      <rect x="-12" y="112" width="24" height="48" rx="5" fill="url(#actuatorGrad)" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="0" cy="120" r="3" fill="#22c55e"/>
      <rect x="-9" y="160" width="18" height="8" fill="url(#brassGrad)"/>
      <path d="M0,76 v15 M0,196 v15" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

      <rect x="-48" y="225" width="96" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="243" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Gabinet</text>
      <text x="0" y="258" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">1.1 l/m</text>
      <text x="0" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">66 l/h • 58m</text>
      <rect x="-38" y="280" width="34" height="22" rx="4" fill="#334155"/>
      <text x="-21" y="295" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">-</text>
      <rect x="4" y="280" width="34" height="22" rx="4" fill="#0284c7"/>
      <text x="21" y="295" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">+</text>
    </g>

  </g>
</svg>